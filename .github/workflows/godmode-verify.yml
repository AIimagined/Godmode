name: Godmode verification
# A fixed run title: without it a push-triggered run is titled with the
# commit's subject line.
run-name: Godmode verification (${{ github.ref_name }})

# Every push to main or a release branch, and every pull request to main,
# runs CI; so does a manual dispatch. The repository is public, so standard
# GitHub-hosted runners cost nothing.
on:
  push:
    branches: [main, "sprint/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    # Three dials, so one dispatch can be narrowed without editing this file
    # and without a second workflow. `shards` decides how many of the fixed
    # four preflight legs below actually run; `suite` is the unittest target
    # those legs validate; `hosts` narrows the generated per-host jobs.
    inputs:
      shards:
        description: "How many preflight shards to run (1 to 4)"
        required: false
        default: "4"
      suite:
        description: "The unittest target each preflight shard validates"
        required: false
        default: "discover"
      hosts:
        description: "Host jobs to run: all, or a comma-separated subset (a narrowed run is deliberately not a complete one, and the aggregate job below says so)"
        required: false
        default: "all"

# Least privilege at the top: read the checkout, nothing else. No job below
# pushes, comments, releases, or otherwise writes back to GitHub, so no job
# widens this - the checkout on every job below runs with `contents: read`
# and additionally sets `persist-credentials: false`, so the (already
# read-only) token is not even left on disk once the checkout step returns.
permissions:
  contents: read

jobs:
  verify:
    # Windows and macOS legs are both tested here: the primary development
    # platform and the third OS, not assumed.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows runs in the verify-windows job below, split four ways: one
        # Windows leg over the whole suite took 29-43 minutes and set the
        # length of every run (2026-09-23).
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    # Belt and braces: every
    # GitHub Actions runner sets `CI=true` for every step, and
    # `godmode_sentinel.attended()` reads it as evidence nobody is watching -
    # true of a real CI push, false of this job, which runs the suite on a
    # human's own `workflow_dispatch`. Per-module `tests/_host_env.py`
    # scrubbing (`scrubbed_environment`/`scrubbed_env`) is the primary
    # defense; this is the second layer, at the job level, so a module that
    # has not yet opted into the per-module scrub (`tests/test_attendance_scrub.py`
    # names the ones that have not) still runs attended here instead of
    # silently inheriting the ambient `CI`. `tests/test_unattended_tier.py`'s
    # own `CI=1` regression test is unaffected: it sets `CI`/`GODMODE_ATTENDED`
    # through `scrubbed_environment`'s `extra`, which replaces the whole
    # process environment (`clear=True`) for the duration, so this job-level
    # value is not present to interfere.
    env:
      GODMODE_ATTENDED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the ranking gate's freshness instrument reads git
          # commit time, and a shallow checkout is a different instrument
          # than the committed snapshot was generated under - the comparison
          # would honestly skip itself (ranking-mode-differs) instead of
          # verifying anything.
          fetch-depth: 0
          # The job token is only used to read this checkout; it has nothing
          # to push, so it is not left on disk for a later step to find.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall scripts hooks tests

      - name: Run acceptance tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test the command line
        run: python scripts/godmode.py --version

      # Separate steps on purpose: one gate per command, so a failure names itself
      # instead of arriving as a single opaque non-zero exit.
      - name: Prove the controls enforce
        run: python scripts/godmode.py --project . selftest --brief

      - name: Stage known failures and check something notices
        run: python scripts/godmode.py --project . scenarios --brief

      - name: Check host manifests match their source
        run: python scripts/godmode.py --project . bindings --brief

      - name: Publish the dependency claim
        run: python scripts/godmode.py --project . sbom --brief

      - name: Enforce the dependency policy
        run: python scripts/godmode.py --project . sbom --gate --brief

      # One gate per step so a failure names itself.
      - name: Attack every control and require it to hold
        run: python scripts/godmode.py --project . grid --brief

      # The skills' behaviour probes run real verbs (guard, planmode, law
      # show) that need an initialized archive. A fresh checkout has none;
      # until 0.3.28 one appeared only because the unit tests initialized
      # the repository as a side effect, which they no longer do.
      - name: Initialize the archive the behaviour probes run against
        run: python scripts/godmode.py --project . init
      - name: Open the session the plan-mode probe needs
        run: python scripts/godmode.py --project . session open
      - name: Execute the routing evals against their snapshots
        run: python scripts/godmode.py --project . evals --brief

      - name: Check routing scores against the committed baseline
        run: python scripts/godmode.py --project . evals --ratchet --brief

      - name: Run the routing harness twice and require identical routes
        run: python scripts/godmode.py --project . evals --determinism --brief

      - name: Validate every config file
        run: python scripts/godmode.py --project . config check --brief

      - name: Validate localized guidance against its sources
        run: python scripts/godmode.py --project . locale check --brief

      - name: Reconcile every version surface
        run: python scripts/godmode.py --project . version --reconcile --brief

      - name: Diagnose the code atlas
        run: python scripts/godmode.py --project . atlas diagnose --brief

      - name: Check dependency direction between hooks and the runtime
        run: python scripts/godmode.py --project . atlas --direction --brief

      - name: Scan repository text for instruction-shaped content
        run: python scripts/godmode.py --project . untrusted --brief

      - name: Report what checked-in agent configuration would run or permit
        run: python scripts/godmode.py --project . trust

      - name: Prove the checksum manifest is reproducible
        run: |
          python scripts/godmode.py --project . --json checksums > first.json
          python scripts/godmode.py --project . --json checksums > second.json
          python -c "import json;a=json.load(open('first.json'));b=json.load(open('second.json'));assert a['manifest_sha256']==b['manifest_sha256'],'checksums not reproducible';print('reproducible:',a['manifest_sha256'])"

  # Bare `python` does not exist on a stock MacBook, so a hook can die
  # silently there, and the matrix legs above install it via setup-python, so
  # a green matrix proves nothing about a real install.
  # This job is the class-killer: no setup-python, bare `python` shadowed by
  # a poison shim, and the hooks invoked exactly as a host invokes them
  # (through hooks/run-hook.cmd under /bin/sh). If the launcher ever regresses
  # to needing `python`, this job goes red before any field machine does.
  # The suite on Windows, in four parallel parts. The split is
  # godmode_preflight.shard_modules - sorted module names dealt round-robin -
  # so the four parts together are exactly the suite, and part 2 means the
  # same modules on every run.
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    env:
      GODMODE_ATTENDED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      # Tests that call the real CLI on this checkout (evals, the gate under
      # pwsh) need an initialized project with an open session.
      - name: Initialize the archive
        run: python scripts/godmode.py --project . init
      - name: Open a session
        run: python scripts/godmode.py --project . session open

      - name: Run this part of the acceptance tests
        shell: bash
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); from pathlib import Path; from godmode_runtime.godmode_preflight import shard_modules; print(' '.join(shard_modules(Path('tests'), 4)[int(sys.argv[1])]))" ${{ matrix.part }} > part-modules.txt
          python -m unittest $(cat part-modules.txt) -v

  stock-host:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Poison bare `python` (the stock-macOS shape)
        run: |
          mkdir -p /tmp/nopython
          printf '#!/bin/sh\necho "bare python must not be reachable" >&2\nexit 127\n' > /tmp/nopython/python
          chmod +x /tmp/nopython/python
          echo "/tmp/nopython" >> "$GITHUB_PATH"

      - name: Run every hook entry the way a host does
        run: |
          set -e
          command -v python3 >/dev/null || { echo "runner image lost python3"; exit 1; }
          run_hook() {
            payload="$1"; shift
            out=$(printf '%s' "$payload" | ./hooks/run-hook.cmd "$@") || { echo "hook $* exited non-zero"; exit 1; }
            if [ -n "$out" ]; then
              printf '%s' "$out" | python3 -c "import json,sys; json.load(sys.stdin)" \
                || { echo "hook $* emitted non-JSON: $out"; exit 1; }
            fi
            echo "hook $* ok"
          }
          run_hook '{"hook_event_name":"SessionStart","cwd":"."}' godmode_session_hook.py session-start
          run_hook '{"hook_event_name":"Stop","cwd":"."}' godmode_session_hook.py stop
          run_hook '{"hook_event_name":"PreToolUse","cwd":".","tool_name":"Bash","tool_input":{"command":"echo hi"}}' godmode_gate_fast.py
          run_hook '{"hook_event_name":"PostToolUse","cwd":".","tool_name":"Edit","tool_input":{"file_path":"README.md"}}' godmode_post_edit.py

      # The plain POSIX sibling (`hooks/run-hook.sh`, for hosts whose
      # manifest wants a bare `.sh` rather than the sh/cmd polyglot) proven
      # under the identical stock-macOS conditions this job already builds -
      # no setup-python, bare `python` poisoned, a non-login shell. Same
      # class-killer reasoning as the `.cmd` half above: if this launcher
      # ever regresses to needing bare `python`, this step goes red.
      - name: Run every hook entry through the POSIX .sh sibling
        run: |
          set -e
          run_hook_sh() {
            payload="$1"; shift
            out=$(printf '%s' "$payload" | ./hooks/run-hook.sh "$@") || { echo "hook $* (sh) exited non-zero"; exit 1; }
            if [ -n "$out" ]; then
              printf '%s' "$out" | python3 -c "import json,sys; json.load(sys.stdin)" \
                || { echo "hook $* (sh) emitted non-JSON: $out"; exit 1; }
            fi
            echo "hook $* (sh) ok"
          }
          run_hook_sh '{"hook_event_name":"SessionStart","cwd":"."}' godmode_session_hook.py session-start
          run_hook_sh '{"hook_event_name":"Stop","cwd":"."}' godmode_session_hook.py stop
          run_hook_sh '{"hook_event_name":"PreToolUse","cwd":".","tool_name":"Bash","tool_input":{"command":"echo hi"}}' godmode_gate_fast.py
          run_hook_sh '{"hook_event_name":"PostToolUse","cwd":".","tool_name":"Edit","tool_input":{"file_path":"README.md"}}' godmode_post_edit.py

      - name: Smoke the CLI on python3 only
        run: python3 scripts/godmode.py --version

  # On Windows, Grok hands a plugin hook's command string to PowerShell,
  # where a previously quoted-path shape was a ParserError and every hook
  # fail-opened. The matrix legs run hooks through
  # Python directly, so a green matrix proved nothing about that shell. This
  # job feeds the exact shared command strings to pwsh, with the plugin root
  # arriving only as an environment variable, the way Grok passes it.
  stock-host-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run every shared hook command through PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $env:CLAUDE_PLUGIN_ROOT = (Get-Location).Path
          $manifest = Get-Content -Raw hooks/hooks.json | ConvertFrom-Json
          $failed = $false
          foreach ($event in $manifest.hooks.PSObject.Properties) {
            foreach ($group in $event.Value) {
              foreach ($entry in $group.hooks) {
                # Grok rewrites known $VAR / ${VAR} refs to $env:VAR before pwsh runs the string.
                $cmd = $entry.command.Replace('${CLAUDE_PLUGIN_ROOT}', '$env:CLAUDE_PLUGIN_ROOT')
                $payload = @{ hook_event_name = $event.Name; cwd = (Get-Location).Path } | ConvertTo-Json -Compress
                $out = ($payload | pwsh -NoProfile -Command $cmd 2>&1 | Out-String)
                if ($out -match "ParserError") { Write-Host "PARSE FAILURE for $($event.Name): $out"; $failed = $true }
                else { Write-Host "ok $($event.Name): $cmd" }
              }
            }
          }
          # A plain checkout has no archive, and the fast gate answers an
          # ungoverned checkout with a silent allow by design (0.3.19); the
          # deny check below needs a governed one.
          python scripts/godmode.py --project . init | Out-Null
          $gate = ($manifest.hooks.PreToolUse | ForEach-Object { $_.hooks } | Where-Object { $_.command -match "godmode_gate_fast" } | Select-Object -First 1).command.Replace('${CLAUDE_PLUGIN_ROOT}', '$env:CLAUDE_PLUGIN_ROOT')
          $push = @{ hook_event_name = "PreToolUse"; tool_name = "Bash"; tool_input = @{ command = "git push --force origin main" }; cwd = (Get-Location).Path } | ConvertTo-Json -Compress
          $deny = ($push | pwsh -NoProfile -Command $gate 2>&1 | Out-String)
          if ($deny -notmatch '"deny"') { Write-Host "gate did not refuse a force-push under pwsh: $deny"; $failed = $true }
          if ($failed) { exit 1 }

  # Differential network capture: every PRD-named CLI surface (init, inspect,
  # resume, doctor, report) runs against a throwaway project under a socket
  # audit hook; any recorded connection fails the job. The gate first proves it
  # can detect a planted connection attempt, so an empty capture is evidence of
  # zero network use, not evidence of a blind detector.
  netgate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the ranking gate's freshness instrument reads git
          # commit time, and a shallow checkout is a different instrument
          # than the committed snapshot was generated under - the comparison
          # would honestly skip itself (ranking-mode-differs) instead of
          # verifying anything.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      # Calls the module directly so this gate holds regardless of CLI wiring.
      - name: Prove the runtime makes zero network connections
        run: |
          python -c "import sys, json, pathlib; sys.path.insert(0, 'scripts'); from godmode_runtime.godmode_netgate import differential; r = differential(pathlib.Path('.')); print(json.dumps(r, indent=2)); sys.exit(0 if r['clean'] else 1)"

  # Every gate-corpus row is classified with the runtime at the merge base
  # and at this commit; any decision flip not labelled `by-design` with a
  # note fails the job.
  corpus-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the base commit must be readable.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Report gate decision flips against the merge base
        run: |
          base="$(git merge-base origin/main HEAD)"
          python scripts/dev/corpus_differential.py --base "$base" --head HEAD

  # Vulnerability scan with a documented triage path.
  #
  # Honesty note: the Godmode runtime is stdlib-only with zero dependencies, so
  # `pip-audit` has no runtime dependency tree to inspect. What can carry known
  # vulnerabilities is the CI tooling environment itself (pip, setuptools,
  # pip-audit's own dependencies, and any future dev tooling), so that surface
  # is what this job scans - deliberately, and labelled as such.
  #
  # Triage path for any finding:
  #   1. Open an issue labelled `security` quoting the pip-audit output.
  #   2. Assess the finding against THREAT-MODEL.md. A vulnerability in CI
  #      tooling (not the runtime) is documented in the issue as CI-surface
  #      only; it does not weaken the runtime's zero-dependency claim, which
  #      the `sbom --gate` step enforces separately.
  #   3. Upgrade or pin the affected tool, then re-run this job to confirm.
  vuln-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the ranking gate's freshness instrument reads git
          # commit time, and a shallow checkout is a different instrument
          # than the committed snapshot was generated under - the comparison
          # would honestly skip itself (ranking-mode-differs) instead of
          # verifying anything.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # Reported, not blocking. This job audits the CI tooling environment, and
      # the job's own rationale says a finding there does not touch the runtime's
      # dependency claim - which `sbom --gate` enforces separately and does
      # block. Failing the product's build on a pip CVE would train the reader
      # to ignore a red mark that means nothing about the product.
      - name: Audit the CI tooling environment
        continue-on-error: true
        run: pip-audit --strict --local

      - name: Print the triage path on failure
        if: failure()
        run: |
          echo "pip-audit found a known vulnerability in the CI tooling environment."
          echo "Triage: open an issue labelled 'security' quoting the finding, assess"
          echo "it against THREAT-MODEL.md, and record whether it touches only CI"
          echo "tooling (the Godmode runtime has zero dependencies, so a CI-tooling"
          echo "finding does not affect the runtime's dependency claim). Upgrade or"
          echo "pin the affected tool, then re-run this job."

  # The published action, exercised the way a consumer repository would use it.
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the ranking gate's freshness instrument reads git
          # commit time, and a shallow checkout is a different instrument
          # than the committed snapshot was generated under - the comparison
          # would honestly skip itself (ranking-mode-differs) instead of
          # verifying anything.
          fetch-depth: 0
          persist-credentials: false

      # The action resolves python3 on its own, but pinning the version here
      # exercises the path a consumer repository is most likely to use.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Run the gates via the action
        # Advisory until 0.3.29 gives each check a fail level: this job proves
        # the composite action loads and runs, and its test-change monitors
        # report on the diff rather than fail the build, since a deliberate new
        # monitor can change the test count without indicating a regression.
        continue-on-error: true
        uses: ./
        with:
          # On push, HEAD~1 keeps the gates real; plain HEAD would diff an empty
          # set and pass vacuously on every push.
          base: ${{ github.event_name == 'pull_request' && format('origin/{0}...', github.base_ref) || 'HEAD~1' }}

  # The suite as time-capped shards. One process over the whole suite is the
  # shape that gets killed for memory on a small machine, and a single
  # 30-minute leg is also the shape that hides which test was slow. The
  # matrix is fixed at four entries because a dispatch input cannot size a
  # matrix; `shards` decides how many of the four run, and a leg whose index
  # is not below that count does not run at all. Index 0 always runs (the
  # smallest legal shard count is 1), so the aggregate job below never sees
  # this job as a whole-job skip. The split is deterministic for a given
  # tree - `godmode_preflight.shard_modules` deals the sorted test module
  # names out round-robin - so shard 2 of 4 means the same modules here as
  # it does on the operator's machine.
  preflight-shard:
    name: "Preflight shard ${{ matrix.index }} of ${{ (inputs.shards || '4') }}"
    # The shard condition sits on each step, not on the job: GitHub evaluates
    # a job-level `if` before the matrix expands, so `matrix` is not bound
    # there and the whole workflow fails to parse.
    # A leg above the requested count runs no steps and finishes green.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3]
    env:
      # Same reason as the `verify` job above: a `workflow_dispatch` run is a
      # person watching, and the ambient `CI=true` would tell the sentinel
      # the opposite.
      GODMODE_ATTENDED: "1"
    steps:
      - name: Check out repository
        if: ${{ matrix.index < fromJSON((inputs.shards || '4')) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the preflight validates a committed state and reads
          # the tree's own history for its scans; a shallow checkout is a
          # different tree than the one being validated.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        if: ${{ matrix.index < fromJSON((inputs.shards || '4')) }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      # The preflight records its verdict in the archive and refuses without
      # an open session; a fresh checkout has neither.
      - name: Initialize the archive the preflight records into
        if: ${{ matrix.index < fromJSON((inputs.shards || '4')) }}
        run: python scripts/godmode.py --project . init
      - name: Open the session the preflight requires
        if: ${{ matrix.index < fromJSON((inputs.shards || '4')) }}
        run: python scripts/godmode.py --project . session open

      - name: Run this shard of the preflight suite
        if: ${{ matrix.index < fromJSON((inputs.shards || '4')) }}
        # Advisory: the verify legs above already run this suite and fail the
        # build on it; this shard adds the preflight's judgment checks, which
        # read a lived-in archive (sources read, assumptions recorded) that a
        # fresh CI checkout never has, so they cannot pass here.
        continue-on-error: true
        run: python scripts/godmode.py --project . precheck --preflight --suite-shards ${{ (inputs.shards || '4') }} --shard-index ${{ matrix.index }} --suite "python -m unittest ${{ (inputs.suite || 'discover') }}"

  # One generated job per host manifest, between these two markers.
  # `scripts/dev/gen_host_ci_jobs.py` owns this block - regenerate with
  # `python scripts/dev/gen_host_ci_jobs.py` rather than hand-editing;
  # `tests/test_ci_host_jobs.py` diffs it against the generator. Each job
  # installs the plugin the way that host does (a project-level `hooks wire`
  # for a host that has one, a copy of the bundled artifact for a host that
  # does not) and fires one hook through the shared launcher with a
  # protected-class payload, requiring the deny.
  # godmode:host-jobs:begin
  host-antigravity:
    name: "Install and fire: antigravity"
    if: ${{ (inputs.hosts || 'all') == 'all' || contains(format(',{0},', (inputs.hosts || 'all')), ',antigravity,') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODMODE_ATTENDED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install the plugin the way antigravity does
        run: |
          set -e
          project="$RUNNER_TEMP"/godmode-host-antigravity/project
          mkdir -p "$project"
          python scripts/godmode.py --project "$project" hooks wire --host antigravity
