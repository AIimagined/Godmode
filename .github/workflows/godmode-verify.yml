name: Godmode verification

# Manual dispatch only, deliberately. This repository's owner has no
# GitHub Actions minutes, so a `push:` trigger would spend minutes that do
# not exist on the very first push - silently, and before anyone chose to
# run anything. Re-enable `push:` and `pull_request:` here once minutes are
# available; nothing else needs to change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Windows and macOS legs close S1-14: the primary development platform and
    # the third OS are tested, not assumed.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history: the ranking gate's freshness instrument reads git
          # commit time, and a shallow checkout is a different instrument
          # than the committed snapshot was generated under - the comparison
          # would honestly skip itself (ranking-mode-differs) instead of
          # verifying anything.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall scripts hooks tests

      - name: Run acceptance tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test the command line
        run: python scripts/godmode.py --version

      # Separate steps on purpose: one gate per command, so a failure names itself
      # instead of arriving as a single opaque non-zero exit.
      - name: Prove the controls enforce
        run: python scripts/godmode.py --project . selftest --brief

      - name: Stage known failures and check something notices
        run: python scripts/godmode.py --project . scenarios --brief

      - name: Check host manifests match their source
        run: python scripts/godmode.py --project . bindings --brief

      - name: Publish the dependency claim
        run: python scripts/godmode.py --project . sbom --brief

      - name: Enforce the dependency policy
        run: python scripts/godmode.py --project . sbom --gate --brief

      # One gate per step so a failure names itself.
      - name: Attack every control and require it to hold
        run: python scripts/godmode.py --project . grid --brief

      - name: Execute the routing evals against their snapshots
        run: python scripts/godmode.py --project . evals --brief

      - name: Validate every config file
        run: python scripts/godmode.py --project . config check --brief

      - name: Validate localized guidance against its sources
        run: python scripts/godmode.py --project . locale check --brief

      - name: Reconcile every version surface
        run: python scripts/godmode.py --project . version --reconcile --brief

      - name: Diagnose the code atlas
        run: python scripts/godmode.py --project . atlas diagnose --brief

      - name: Scan repository text for instruction-shaped content
        run: python scripts/godmode.py --project . untrusted --brief

      - name: Report what checked-in agent configuration would run or permit
        run: python scripts/godmode.py --project . trust

      - name: Prove the checksum manifest is reproducible
        run: |
          python scripts/godmode.py --project . --json checksums > first.json
          python scripts/godmode.py --project . --json checksums > second.json
          python -c "import json;a=json.load(open('first.json'));b=json.load(open('second.json'));assert a['manifest_sha256']==b['manifest_sha256'],'checksums not reproducible';print('reproducible:',a['manifest_sha256'])"

  # Differential network capture: every PRD-named CLI surface (init, inspect,
  # resume, doctor, report) runs against a throwaway project under a socket
  # audit hook; any recorded connection fails the job. The gate first proves it
  # can detect a planted connection attempt, so an empty capture is evidence of
  # zero network use, not evidence of a blind detector.
  netgate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history: the ranking gate's freshness instrument reads git
          # commit time, and a shallow checkout is a different instrument
          # than the committed snapshot was generated under - the comparison
          # would honestly skip itself (ranking-mode-differs) instead of
          # verifying anything.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Calls the module directly so this gate holds regardless of CLI wiring.
      - name: Prove the runtime makes zero network connections
        run: |
          python -c "import sys, json, pathlib; sys.path.insert(0, 'scripts'); from godmode_runtime.godmode_netgate import differential; r = differential(pathlib.Path('.')); print(json.dumps(r, indent=2)); sys.exit(0 if r['clean'] else 1)"

  # Vulnerability scan with a documented triage path.
  #
  # Honesty note: the Godmode runtime is stdlib-only with zero dependencies, so
  # `pip-audit` has no runtime dependency tree to inspect. What can carry known
  # vulnerabilities is the CI tooling environment itself (pip, setuptools,
  # pip-audit's own dependencies, and any future dev tooling), so that surface
  # is what this job scans - deliberately, and labelled as such.
  #
  # Triage path for any finding:
  #   1. Open an issue labelled `security` quoting the pip-audit output.
  #   2. Assess the finding against THREAT-MODEL.md. A vulnerability in CI
  #      tooling (not the runtime) is documented in the issue as CI-surface
  #      only; it does not weaken the runtime's zero-dependency claim, which
  #      the `sbom --gate` step enforces separately.
  #   3. Upgrade or pin the affected tool, then re-run this job to confirm.
  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history: the ranking gate's freshness instrument reads git
          # commit time, and a shallow checkout is a different instrument
          # than the committed snapshot was generated under - the comparison
          # would honestly skip itself (ranking-mode-differs) instead of
          # verifying anything.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # Reported, not blocking. This job audits the CI tooling environment, and
      # the job's own rationale says a finding there does not touch the runtime's
      # dependency claim - which `sbom --gate` enforces separately and does
      # block. Failing the product's build on a pip CVE would train the reader
      # to ignore a red mark that means nothing about the product.
      - name: Audit the CI tooling environment
        continue-on-error: true
        run: pip-audit --strict --local

      - name: Print the triage path on failure
        if: failure()
        run: |
          echo "pip-audit found a known vulnerability in the CI tooling environment."
          echo "Triage: open an issue labelled 'security' quoting the finding, assess"
          echo "it against THREAT-MODEL.md, and record whether it touches only CI"
          echo "tooling (the Godmode runtime has zero dependencies, so a CI-tooling"
          echo "finding does not affect the runtime's dependency claim). Upgrade or"
          echo "pin the affected tool, then re-run this job."

  # The published action, exercised the way a consumer repository would use it.
  action:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Full history: the ranking gate's freshness instrument reads git
          # commit time, and a shallow checkout is a different instrument
          # than the committed snapshot was generated under - the comparison
          # would honestly skip itself (ranking-mode-differs) instead of
          # verifying anything.
          fetch-depth: 0
        with:
          fetch-depth: 0

      # The action resolves python3 on its own, but pinning the version here
      # exercises the path a consumer repository is most likely to use.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run the gates via the action
        uses: ./
        with:
          # On push, HEAD~1 keeps the gates real; plain HEAD would diff an empty
          # set and pass vacuously on every push.
          base: ${{ github.event_name == 'pull_request' && format('origin/{0}...', github.base_ref) || 'HEAD~1' }}
