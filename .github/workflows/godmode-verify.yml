  # godmode:host-jobs:end

  # Aggregate job: the jobs above (the six hand-authored ones plus one
  # generated per host manifest) run in parallel and any one of them can
  # fail, get cancelled, or be skipped without the others noticing. This job
  # depends on every one of them, always runs (`if: always()`, so it evaluates
  # even when an upstream job failed instead of also being skipped), and is
  # the single job to require in branch protection - "green" on this job means
  # every job above actually ran and actually succeeded, never "some subset
  # quietly didn't".
  required:
    name: All required jobs passed
    if: always()
    needs: [verify, verify-windows, stock-host, stock-host-windows, netgate, corpus-differential, vuln-scan, action, preflight-shard, host-antigravity, host-claude, host-codex, host-copilot, host-cursor, host-gemini, host-grok, host-kiro, host-opencode]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more required jobs did not succeed (failure, cancelled, or skipped):"
          echo '${{ toJSON(needs) }}'
          exit 1
